[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustadapt"
version = "0.1.0"
description = "TrustAdapt - Adaptive & Explainable Device Trust"
requires-python = ">=3.12"
# Libraries are pinned in requirements.txt; install that first.
dependencies = []

[project.scripts]
ta-extract = "trustadapt.features.extract:main"
ta-validate = "trustadapt.features.validate:main"
ta-synth = "trustadapt.features.synth:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = ["ignore"]
